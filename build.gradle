plugins {
    id 'java'
    id 'application'
}

group = 'com.m4kyu'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_22 
    targetCompatibility = JavaVersion.VERSION_22
}

application {
    mainClass = 'com.m4kyu.Main'
}

repositories {
    mavenCentral()
}


jar {
    manifest {
        attributes 'Main-Class': 'com.m4kyu.Main'
    }
}

